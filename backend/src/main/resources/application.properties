spring.application.name=studyspot
spring.datasource.url=jdbc:postgresql://localhost:5432/studyspot
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized

studyspot.cors.allowed-origins=http://localhost:5173
studyspot.rate-limit.max-reports=5
studyspot.rate-limit.window-minutes=15